[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-ai-agent-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.35,<2",
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<1",
  "langgraph>=0.2,<1",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1",
  "opentelemetry-sdk>=1.30,<2",
  "Pillow>=11,<12",
  "pydantic-settings>=2.7,<3",
  "PyMuPDF>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "sentry-sdk>=2.20,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[project.scripts]
pdf-agent-worker = "worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend-angular/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r apps/backend-api/requirements-dev.txt -r apps/worker/requirements.txt
      - run: ruff check --no-cache --config apps/backend-api/pyproject.toml apps/backend-api apps/worker
      - run: PYTHONPATH=apps/backend-api:apps/worker mypy apps/backend-api/app apps/worker/worker
      - run: PYTHONPATH=apps/backend-api pytest --cov=app --cov-fail-under=70 apps/backend-api/tests
      - run: PYTHONPATH=apps/worker pytest --cov=worker --cov-fail-under=55 apps/worker/tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

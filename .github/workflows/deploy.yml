name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend-angular/package-lock.json
      - run: npm ci
        working-directory: apps/frontend-angular
      - run: node scripts/configure-frontend.mjs
        env:
          FRONTEND_API_URL: ${{ vars.FRONTEND_API_URL }}
          FRONTEND_MAX_PDF_SIZE_MB: "25"
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - run: npm run build
        working-directory: apps/frontend-angular
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontend-angular/dist/frontend-angular/browser --project-name=pdf-ai-agent

  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Activar despliegue en Render
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Esperar health check
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "${{ vars.API_HEALTH_URL }}"; then exit 0; fi
            sleep 10
          done
          exit 1


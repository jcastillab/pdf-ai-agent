name: pdf-ai-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["standalone-db"]
    environment:
      POSTGRES_DB: pdf_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdf_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/pdf-documents &&
        mc anonymous set none local/pdf-documents

  ollama:
    image: ollama/ollama:0.12.3
    profiles: ["local-ai"]
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]

  clamav:
    image: clamav/clamav:1.4
    profiles: ["security"]
    ports: ["3310:3310"]
    volumes: ["clamav_data:/var/lib/clamav"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infrastructure/docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318", "8889:8889"]

  prometheus:
    image: prom/prometheus:v3.4.0
    profiles: ["observability"]
    volumes: ["./infrastructure/docker/prometheus.yaml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.8.1
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infrastructure/docker/tempo.yaml:/etc/tempo.yaml:ro", "tempo_data:/var/tempo"]
    ports: ["3200:3200"]

  loki:
    image: grafana/loki:3.5.1
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["./infrastructure/docker/loki.yaml:/etc/loki/local-config.yaml:ro", "loki_data:/loki"]
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:12.0.1
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro

volumes:
  postgres_data:
  minio_data:
  ollama_data:
  clamav_data:
  tempo_data:
  loki_data:
  grafana_data:

